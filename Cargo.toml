[package]
name = "Paprika"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
colored = "3.1.1"
env_logger = "0.11.10"
log = "0.4.29"
reqwest = "0.13.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1", features = ["full"] }
rocket = { version = "0.5.1", features = ["json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
pulldown-cmark = "0.9"
