<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paprika Chat</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🌶️ Paprika Chat</h1>
            <p class="subtitle">Dein hilfreicher Wissenschafts-Chatbot aus der Schwedter Str. 14</p>
        </div>

        <div class="messages" id="messages"></div>

        <div class="input-area">
            <div class="input-container">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="Schreib eine Frage..."
                    autofocus
                />
                <button id="sendButton" onclick="sendMessage()">Senden</button>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
